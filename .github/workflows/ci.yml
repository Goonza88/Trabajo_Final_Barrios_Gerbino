name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: chequear la sintaxis de todos los modulos
        run: find . -name '*.mjs' -exec node --check {} \;
      - name: tests
        run: node --test
